name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, format, typecheck, test
    runs-on: ubuntu-latest

    # Real Postgres/Redis for apps/server's integration tests — per
    # docs/conventions.md "Testing rules": "No mocking the database in
    # integration tests." Exposed on the default ports directly to the
    # runner host, matching apps/server/.env.example's local URLs.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: campus
          POSTGRES_PASSWORD: campus
          POSTGRES_DB: campus_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campus -d campus_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://campus:campus@localhost:5432/campus_dev
      REDIS_URL: redis://localhost:6379
      TEST_DATABASE_URL: postgresql://campus:campus@localhost:5432/campus_test
      CORS_ALLOWED_ORIGINS: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck (JSDoc via tsc --noEmit; builds @campus/shared's declarations first)
        run: pnpm run typecheck

      # apps/server's own `pretest` (scripts/prepare-test-db.mjs) creates
      # campus_test and runs `prisma migrate deploy` against it before
      # vitest runs — see apps/server/package.json.
      - name: Test
        run: pnpm run test

  docker-build:
    name: Docker build (server)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build server image
        run: docker build -f apps/server/Dockerfile -t campus-server:ci .

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
