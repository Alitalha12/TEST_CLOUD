name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, format, typecheck, test
    runs-on: ubuntu-latest

    # Real Postgres/Redis for apps/server's integration tests — per
    # docs/conventions.md "Testing rules": "No mocking the database in
    # integration tests." Exposed on the default ports directly to the
    # runner host, matching apps/server/.env.example's local URLs.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: campus
          POSTGRES_PASSWORD: campus
          POSTGRES_DB: campus_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campus -d campus_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://campus:campus@localhost:5432/campus_dev
      REDIS_URL: redis://localhost:6379
      TEST_DATABASE_URL: postgresql://campus:campus@localhost:5432/campus_test
      # A different logical Redis DB (same server) so test-run rate-limit
      # counters/caches never mix with anything else touching REDIS_URL.
      TEST_REDIS_URL: redis://localhost:6379/1
      CORS_ALLOWED_ORIGINS: ''
      # Phase 3 auth secrets — CI-only dummy values (not real, not
      # reused anywhere), just valid enough in shape for env.js's Zod
      # schema: EMAIL_ENC_KEY must be exactly 32 bytes base64-encoded.
      EMAIL_HASH_PEPPER: ci-test-pepper-not-a-real-secret
      EMAIL_ENC_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
      JWT_ACCESS_SECRET: ci-test-jwt-secret-not-a-real-secret-value
      JWT_KID: ci-test-key-1
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      SMTP_FROM: 'Anonymous Campus <no-reply@localhost>'
      MIN_APP_VERSION: 1.0.0
      LATEST_APP_VERSION: 1.0.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck (JSDoc via tsc --noEmit; builds @campus/shared's declarations first)
        run: pnpm run typecheck

      # apps/server's own `pretest` delegates to
      # @campus/database's prepare-test-db script, which creates
      # campus_test and runs `prisma migrate deploy` against it before
      # vitest runs — see apps/server/package.json and packages/database.
      - name: Test
        run: pnpm run test

  docker-build:
    name: Docker build (server)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build server image
        run: docker build -f apps/server/Dockerfile -t campus-server:ci .

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
